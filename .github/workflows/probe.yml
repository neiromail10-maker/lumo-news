name: probe
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: git clone --depth 1 "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" code
      - run: cd code && node probe/probe.js
      - run: |
          cd code/out && git init -q -b probe && git config user.name lumo-probe && git config user.email lumo-probe@users.noreply.github.com && git add -A && git commit -qm probe && git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" probe
